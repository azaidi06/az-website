<script>
  // Navbar scroll effect
  window.addEventListener('scroll', function() {
    const navbar = document.querySelector('.navbar');
    if (!navbar) return;
    if (window.scrollY > 50) navbar.classList.add('scrolled');
    else navbar.classList.remove('scrolled');
  });

  // Theme switcher: light / sepia / dark
  // Default behavior: follow system preference (light/dark). Sepia only when user picks it.
  (function () {
    const KEY = 'az-theme';
    const THEMES = ['light', 'sepia', 'dark'];

    const systemTheme = () =>
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';

    const stored = localStorage.getItem(KEY);
    let activeTheme = THEMES.includes(stored) ? stored : systemTheme();

    const applyTheme = (t) => {
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-bs-theme', t === 'dark' ? 'dark' : 'light');
      document.querySelectorAll('.theme-toggle [data-set-theme]').forEach(b => {
        b.setAttribute('aria-pressed', b.dataset.setTheme === t ? 'true' : 'false');
      });
    };
    applyTheme(activeTheme);

    // If user hasn't chosen explicitly, follow OS changes live
    if (window.matchMedia) {
      const mql = window.matchMedia('(prefers-color-scheme: dark)');
      const handle = () => {
        if (!localStorage.getItem(KEY)) {
          activeTheme = systemTheme();
          applyTheme(activeTheme);
        }
      };
      if (mql.addEventListener) mql.addEventListener('change', handle);
      else if (mql.addListener) mql.addListener(handle);
    }

    function mount() {
      if (document.querySelector('.theme-toggle')) return;
      const navbar = document.querySelector('.navbar');
      if (!navbar) return;

      const wrap = document.createElement('div');
      wrap.className = 'theme-toggle';
      wrap.setAttribute('role', 'radiogroup');
      wrap.setAttribute('aria-label', 'theme');
      wrap.innerHTML = THEMES.map(t => (
        `<button type="button" data-set-theme="${t}" aria-pressed="false" title="${t} mode">${t}</button>`
      )).join('');
      wrap.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-set-theme]');
        if (!btn) return;
        const t = btn.dataset.setTheme;
        localStorage.setItem(KEY, t);
        activeTheme = t;
        applyTheme(t);
      });

      // Place at the very end of the right-side nav (after the last nav-item or tools)
      const tools = navbar.querySelector('.quarto-navbar-tools');
      const navList = navbar.querySelector('.navbar-nav');
      if (tools) tools.appendChild(wrap);
      else if (navList) navList.appendChild(wrap);
      else navbar.appendChild(wrap);

      applyTheme(activeTheme);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mount);
    } else {
      mount();
    }
  })();
</script>
